# Serves the Nyx web build and proxies orc (port 8086 on the same box), so
# the browser only ever talks to one address -- orc's asset files carry no
# CORS headers, which the web build would otherwise need.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/    { proxy_pass http://host.docker.internal:8086; }
    # Flutter's own bundled files also live under /assets/ (fonts, icons,
    # AssetManifest); serve those locally, everything else is orc's catalog.
    location /assets/ { try_files $uri @orc; }
    location @orc     { proxy_pass http://host.docker.internal:8086; proxy_buffering off; }
    location /t/      { proxy_pass http://host.docker.internal:8086; }

    # Always revalidate the app shell so a redeploy shows up on next open.
    # Desktop library snapshot (scripts/publish_library.sh), mounted from
    # ~/apps/nyx-library so redeploying the site doesn't wipe it.
    location /library/ { alias /srv/library/; add_header Cache-Control "no-store"; }

    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /main.dart.js { add_header Cache-Control "no-cache"; }

    location / { try_files $uri $uri/ /index.html; }

    client_max_body_size 1m;
}
